plugins {
    id 'org.springframework.boot'
}

// analysis 모듈이 쓰는 spring-ai-starter-model-openai의 버전을, 실제로 클래스패스를 리졸브하는
// 이 모듈(app)에서도 알아야 한다 — io.spring.dependency-management는 리졸브 주체 프로젝트 기준으로
// 적용되므로, analysis의 dependencyManagement만으로는 app의 runtimeClasspath 리졸브 시점에 전파되지 않는다.
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0" // analysis/build.gradle과 버전 동기화 유지
    }
}

dependencies {
    implementation project(':common')
    implementation project(':identity')
    implementation project(':journal')
    implementation project(':analysis')
    implementation project(':insight')

    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3' // 얼리버드 전 서비스와 버전 동기화
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' // MockMvc/@AutoConfigureMockMvc
    testImplementation 'org.springframework.boot:spring-boot-starter-security' // PasswordEncoder — identity가 implementation으로만 선언해 전파 안 됨
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc' // JdbcTemplate(관리자 승인 통합 테스트의 ADMIN 계정 수동 승격용) — 위와 동일한 이유로 identity에서 전파 안 됨
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs' // 모듈 다이어그램 생성용(포트폴리오 목적)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}
