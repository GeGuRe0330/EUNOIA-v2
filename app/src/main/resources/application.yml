spring:
  application:
    name: eunoia

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://localhost:3306/eunoia
    username: ${DB_USERNAME:eunoia}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 30s
      max-retries: 1

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: DELETE

server:
  servlet:
    session:
      cookie:
        same-site: lax

logging:
  level:
    org.hibernate: info
