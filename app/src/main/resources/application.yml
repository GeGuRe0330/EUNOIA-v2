spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  application:
    name: eunoia

  datasource:
    url: jdbc:mysql://localhost:3306/eunoia
    username: ${DB_USERNAME:eunoia}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: 30s
      max-retries: 1

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: DELETE

server:
  tomcat:
    max-swallow-size: 20MB
  servlet:
    session:
      cookie:
        same-site: lax
        secure: true

logging:
  level:
    org.hibernate: info

eunoia:
  profile-image:
    # 프로필 이미지 저장 디렉터리 — 운영은 PROFILE_IMAGE_DIR(볼륨 마운트 경로), 로컬·테스트는 프로젝트 밖 OS 임시 디렉터리
    dir: ${PROFILE_IMAGE_DIR:${java.io.tmpdir}/eunoia-profile-images}
